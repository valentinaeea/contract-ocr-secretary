name: Build secretary v1 Windows EXE
on:
  push:
    branches: [main]
    paths: ['native/**', 'tests/**', 'requirements-native.txt', 'js/**', 'css/**', 'index.html', 'tools/**', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: secretary-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build offline Windows folder and run EXE smoke test
        shell: pwsh
        run: ./tools/build_windows.ps1 -NoZip
      - name: Python regression tests
        run: .venv-build/Scripts/python.exe -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript regression tests
        shell: pwsh
        run: |
          $tests = 'business_snapshot contract_scope document_view identity_extraction deliverable_extraction amount_extraction critical_review service_content keyword_precision vault_model edit_dialog_model domain_catalog tag_audit'.Split(' ')
          foreach ($test in $tests) {
            node "tests/$test.cjs"
            if ($LASTEXITCODE -ne 0) { throw "Failed: $test" }
          }
      - name: Install browser test runtime
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/ocr-ui" playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
          & "$env:RUNNER_TEMP/ocr-ui/node_modules/.bin/playwright.cmd" install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
      - name: Test packaged secretary OCR UI Excel and cloud merge
        shell: pwsh
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP/ocr-ui/node_modules"
          .venv-build/Scripts/python.exe tests/secretary_browser_host.py dist/ContractOCR/ContractOCR.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged secretary acceptance failed' }
      - name: Package verified Windows folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ContractOCR -DestinationPath ContractOCR-Windows-x64.zip
          $hash = (Get-FileHash ContractOCR-Windows-x64.zip -Algorithm SHA256).Hash
          "$hash  ContractOCR-Windows-x64.zip" | Set-Content -Encoding utf8 SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ContractOCR-Windows-x64
          path: |
            ContractOCR-Windows-x64.zip
            SHA256SUMS.txt
          retention-days: 14
      - name: Publish verified Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'secretary-v1'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'Contract OCR Secretary v1 Windows x64' --notes 'Extract the complete ContractOCR folder and launch ContractOCR.exe. Python and Node are not needed on the user computer. Built and tested on Windows with synthetic documents.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag ContractOCR-Windows-x64.zip SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
